name: Risk Alert Runner

on:
  schedule:
    - cron: '0 2 * * *'  # Todos los días a las 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write


jobs:
  run-risk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python risk_alerts.py
        env:
          PLUTTO_API_KEY: ${{ secrets.PLUTTO_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v3.1.2
        with:
          name: risk-report
          path: risk_report_*.csv
